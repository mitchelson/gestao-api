name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test-and-build
    environment: ENV

    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets da VPS
        id: vps
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER || secrets.VPS_USERNAME }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy ignorado — configure VPS_HOST e VPS_USERNAME no environment ENV."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "auth=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
            echo "auth=password" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Configure VPS_SSH_KEY ou VPS_PASSWORD no environment ENV."
          fi

      - uses: actions/setup-node@v4
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none'
        run: npm ci

      - name: Build
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none'
        run: npm run build

      - name: Cache production node_modules
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none'
        id: cache-prod-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: gestao-api-prod-modules-${{ hashFiles('package-lock.json') }}

      - name: Install production dependencies
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none' && steps.cache-prod-modules.outputs.cache-hit != 'true'
        run: npm ci --omit=dev

      - name: Prepare VPS directories
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'key'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: mkdir -p /opt/gestao-api /var/log/gestao-api

      - name: Prepare VPS directories (senha)
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'password'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: mkdir -p /opt/gestao-api /var/log/gestao-api

      - name: Transfer artifacts to VPS
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'key'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'dist/,node_modules/,package.json,package-lock.json,ecosystem.config.cjs,deploy/post-deploy.sh'
          target: /opt/gestao-api
          rm: false

      - name: Transfer artifacts to VPS (senha)
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'password'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'dist/,node_modules/,package.json,package-lock.json,ecosystem.config.cjs,deploy/post-deploy.sh'
          target: /opt/gestao-api
          rm: false

      - name: Migrate & reload PM2
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'key'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            chmod +x /opt/gestao-api/deploy/post-deploy.sh
            bash /opt/gestao-api/deploy/post-deploy.sh

      - name: Migrate & reload PM2 (senha)
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'password'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            chmod +x /opt/gestao-api/deploy/post-deploy.sh
            bash /opt/gestao-api/deploy/post-deploy.sh
